kind = "video"
previewPath = "/proven-path-video/"
title = "Proven Path Video"
version = "1.0.0"
id = "artifacts/proven-path-video"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/proven-path-video/" ]
localPort = 21940

[services.development]
run = "pnpm --filter @workspace/proven-path-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/proven-path-video", "run", "build" ]
publicDir = "artifacts/proven-path-video/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21940"
BASE_PATH = "/proven-path-video/"
