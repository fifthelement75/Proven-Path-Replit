<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Proven Path — Performance Intelligence for Modern HR Teams</title>
    <meta name="description" content="Proven Path gives HR teams a single source of truth for candidate assessments, performance reviews, and career development—so every hiring and promotion decision is backed by verified data." />
    <meta name="theme-color" content="#2563eb" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="Proven Path" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Proven Path — Performance Intelligence for Modern HR Teams" />
    <meta property="og:description" content="A single source of truth for candidate assessments, performance reviews, and career development. Hire smarter, develop faster, retain longer." />
    <meta property="og:image" content="__SITE_ORIGIN__%BASE_URL%opengraph.jpg" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta property="og:image:alt" content="Proven Path dashboard and performance intelligence preview" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="__SITE_ORIGIN__/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Proven Path — Performance Intelligence for Modern HR Teams" />
    <meta name="twitter:description" content="A single source of truth for candidate assessments, performance reviews, and career development. Hire smarter, develop faster, retain longer." />
    <meta name="twitter:image" content="__SITE_ORIGIN__%BASE_URL%opengraph.jpg" />
    <meta name="twitter:image:alt" content="Proven Path dashboard and performance intelligence preview" />

    <!-- Canonical -->
    <link rel="canonical" href="__SITE_ORIGIN__/" />

    <!-- Structured Data: Organization + WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "__SITE_ORIGIN__/#organization",
          "name": "Proven Path",
          "url": "__SITE_ORIGIN__/",
          "logo": {
            "@type": "ImageObject",
            "url": "__SITE_ORIGIN__/favicon.png"
          },
          "description": "Proven Path gives HR teams a single source of truth for candidate assessments, performance reviews, and career development—so every hiring and promotion decision is backed by verified data.",
          "sameAs": []
        },
        {
          "@type": "WebSite",
          "@id": "__SITE_ORIGIN__/#website",
          "url": "__SITE_ORIGIN__/",
          "name": "Proven Path",
          "description": "Performance Intelligence for Modern HR Teams",
          "publisher": {
            "@id": "__SITE_ORIGIN__/#organization"
          }
        }
      ]
    }
    </script>

    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
