kind = "web"
previewPath = "/"
title = "ProvenPath Platform"
version = "1.0.0"
id = "artifacts/career-passport"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23852

[services.development]
run = "pnpm --filter @workspace/career-passport run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/career-passport", "run", "build" ]
publicDir = "artifacts/career-passport/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23852"
BASE_PATH = "/"
