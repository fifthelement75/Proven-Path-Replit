openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Career Passport API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: companies
    description: Company operations
  - name: employees
    description: Employee operations
  - name: reviews
    description: Performance review operations
  - name: feedback
    description: Continuous feedback log operations
  - name: devplan
    description: AI Development plan operations
  - name: share
    description: Share link operations
  - name: integrations
    description: Company-scoped authorization and admin-reviewed provider data exchange

paths:
  /integrations:
    get:
      operationId: listIntegrationConnections
      tags: [integrations]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Company connections, including selections requiring authorization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationConnectionList" }
  /integrations/authorize:
    post:
      operationId: authorizeIntegrationProvider
      tags: [integrations]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntegrationSelectionInput" }
      responses:
        "200":
          description: Short-lived company-scoped authorization link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationAuthorization" }
  /integrations/credentials:
    post:
      operationId: saveCustomerCredential
      tags: [integrations]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerCredentialInput" }
      responses:
        "200":
          description: Customer credential encrypted after a successful live read-only health check
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationConnectionResult" }
  /integrations/connect:
    post:
      operationId: verifyIntegrationConnection
      tags: [integrations]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntegrationSelectionInput" }
      responses:
        "200":
          description: Provider authorization verified against the company identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationConnectionResult" }
  /integrations/disconnect:
    post:
      operationId: disconnectIntegrationProvider
      tags: [integrations]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntegrationSelectionInput" }
      responses:
        "200":
          description: Account revoked and local connection removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationDisconnectResult" }
  /integrations/exchange/catalog:
    get:
      operationId: getIntegrationCatalog
      tags: [integrations]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Live provider availability in the configured Connect project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationCatalog" }
  /integrations/exchange/sources:
    get:
      operationId: getIntegrationExchangeSources
      tags: [integrations]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Up to 500 records of each type, scoped to the admin's company
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExchangeSources" }
  /integrations/exchange/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      operationId: getIntegrationExchange
      tags: [integrations]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Verified connection operations and recent exchange history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExchangeDetails" }
  /integrations/exchange/{id}/run:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      operationId: runIntegrationExchange
      tags: [integrations]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExchangeOperationInput" }
      responses:
        "200":
          description: Persisted operation outcome; uncertain writes are not automatically retried
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExchangeResult" }
        "202":
          description: This request ID is already running
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExchangeResult" }
  /integrations/exchange/{id}/runs/{runId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: runId, in: path, required: true, schema: { type: integer } }
    get:
      operationId: getIntegrationExchangeResult
      tags: [integrations]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Company-scoped persisted result and normalized rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExchangeResult" }
  /integrations/exchange/{id}/import:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      operationId: importIntegrationRecord
      tags: [integrations]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExchangeImportInput" }
      responses:
        "200":
          description: Record imported once, or the existing import returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExchangeImportResult" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Auth
  /auth/register:
    post:
      operationId: registerCompany
      tags: [auth]
      summary: Register a new company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterCompanyBody"
      responses:
        "201":
          description: Company registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Companies
  /companies/me:
    get:
      operationId: getMyCompany
      tags: [companies]
      summary: Get current company details
      responses:
        "200":
          description: Company details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /companies/me/health:
    get:
      operationId: getCompanyHealth
      tags: [companies]
      summary: Get company health stats (wow endpoint)
      responses:
        "200":
          description: Company health summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyHealth"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /companies/me/activity:
    get:
      operationId: getRecentActivity
      tags: [companies]
      summary: Get recent activity feed (wow endpoint)
      responses:
        "200":
          description: Recent activity items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Employees
  /employees:
    get:
      operationId: listEmployees
      tags: [employees]
      summary: List all employees in the company
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: department
          in: query
          schema:
            type: string
        - name: level
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      operationId: createEmployee
      tags: [employees]
      summary: Add a new employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmployeeBody"
      responses:
        "201":
          description: Employee created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /employees/{id}:
    get:
      operationId: getEmployee
      tags: [employees]
      summary: Get an employee by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Employee details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateEmployee
      tags: [employees]
      summary: Update an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmployeeBody"
      responses:
        "200":
          description: Employee updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteEmployee
      tags: [employees]
      summary: Delete an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /employees/{id}/score-history:
    get:
      operationId: getEmployeeScoreHistory
      tags: [employees]
      summary: Get employee score history over time (wow endpoint)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Score history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScoreHistoryItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Performance Reviews
  /employees/{employeeId}/reviews:
    get:
      operationId: listReviews
      tags: [reviews]
      summary: List all reviews for an employee
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reviews list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      operationId: createReview
      tags: [reviews]
      summary: Create a performance review
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewBody"
      responses:
        "201":
          description: Review created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /employees/{employeeId}/reviews/{reviewId}:
    get:
      operationId: getReview
      tags: [reviews]
      summary: Get a specific review
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
        - name: reviewId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Review details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateReview
      tags: [reviews]
      summary: Update a review
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
        - name: reviewId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReviewBody"
      responses:
        "200":
          description: Review updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Feedback Log
  /employees/{employeeId}/feedback:
    get:
      operationId: listFeedback
      tags: [feedback]
      summary: List feedback log entries for an employee
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Feedback entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedbackEntry"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      operationId: createFeedback
      tags: [feedback]
      summary: Create a feedback log entry
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeedbackBody"
      responses:
        "201":
          description: Feedback entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackEntry"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /employees/{employeeId}/feedback/{feedbackId}/respond:
    post:
      operationId: respondToFeedback
      tags: [feedback]
      summary: Employee responds to a feedback entry
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
        - name: feedbackId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackResponseBody"
      responses:
        "200":
          description: Response saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackEntry"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Dev Plan
  /employees/{employeeId}/dev-plan:
    get:
      operationId: getDevPlan
      tags: [devplan]
      summary: Get the development plan for an employee
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dev plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevPlan"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /employees/{employeeId}/dev-plan/generate:
    post:
      operationId: generateDevPlan
      tags: [devplan]
      summary: Generate/regenerate AI development plan
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dev plan generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevPlan"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /employees/{employeeId}/dev-plan/skills/{skillId}/complete:
    patch:
      operationId: markSkillComplete
      tags: [devplan]
      summary: Mark a dev plan skill as complete
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
        - name: skillId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkSkillCompleteBody"
      responses:
        "200":
          description: Skill updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevPlanSkill"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Share Links
  /employees/{employeeId}/share:
    post:
      operationId: createShareLink
      tags: [share]
      summary: Generate a shareable read-only link
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShareLinkBody"
      responses:
        "201":
          description: Share link created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLink"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      operationId: listShareLinks
      tags: [share]
      summary: List existing share links for an employee
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Share links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShareLink"

  /share/{token}:
    get:
      operationId: getPublicProfile
      tags: [share]
      summary: Get public profile via share token (no auth required)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfile"
        "404":
          description: Not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /integrations/sync/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getIntegrationSync
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Approved configuration, progress, issues and outbound reconciliation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationSyncStatus" }
    post:
      operationId: controlIntegrationSync
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntegrationSyncCommand" }
      responses:
        "200":
          description: Preview or updated sync status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationSyncStatus" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    IntegrationSyncCommand:
      type: object
      required: [command]
      properties:
        command: { type: string, enum: [preview, approve, disable, run, reconcile] }
        config: { $ref: "#/components/schemas/IntegrationSyncConfig" }
        previewId: { type: string }
        writeId: { type: integer }
        confirmOutbound: { type: boolean }
        resolution: { type: string, enum: [applied, not_applied] }
    IntegrationSyncConfig:
      type: object
      required: [actionKey, props, fields, intervalMinutes, pagination]
      properties:
        actionKey: { type: string }
        props: { type: object, additionalProperties: true }
        fields:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/IntegrationSyncField"
        intervalMinutes: { type: integer, minimum: 15, maximum: 1440 }
        pagination:
          type: object
          required: [mode]
          properties:
            mode: { type: string, enum: [single, page, offset, cursor] }
            prop: { type: string }
            nextPath: { type: string }
            pageSize: { type: integer, minimum: 1, maximum: 250 }
        updatedAtPath: { type: string }
        updatedSinceProp: { type: string, description: "Optional provider input receiving the last completed high-water timestamp as ISO 8601" }
        outbound:
          type: object
          required: [actionKey, props, fields]
          properties:
            actionKey: { type: string }
            props: { type: object, additionalProperties: true }
            fields: { type: object, additionalProperties: { type: string } }
    IntegrationSyncField:
      type: object
      required: [source, owner]
      properties:
        source: { type: string, description: "Dotted provider path or normalized field prefixed with $" }
        owner: { type: string, enum: [provider, local] }
    IntegrationSyncStatus:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        config: { $ref: "#/components/schemas/IntegrationSyncConfig" }
        previewId: { type: string }
        preview: { type: array, items: { type: object, additionalProperties: true } }
        lastSyncAt: { type: ["string", "null"] }
        nextSyncAt: { type: ["string", "null"] }
        message: { type: ["string", "null"] }
        cursor: { type: object, additionalProperties: true }
        issues: { type: array, items: { type: object, additionalProperties: true } }
        writes: { type: array, items: { type: object, additionalProperties: true } }
        runs: { type: array, items: { type: object, additionalProperties: true } }
    CustomerCredentialInput:
      type: object
      required: [provider, consent]
      properties:
        provider: { type: string, enum: [otter, icims] }
        consent: { type: boolean, enum: [true] }
        accountLabel: { type: string, maxLength: 120 }
        apiKey: { type: string, minLength: 1, maxLength: 4096, writeOnly: true }
        customerId: { type: string, pattern: "^[1-9][0-9]{0,11}$" }
        username: { type: string, minLength: 1, maxLength: 500, writeOnly: true }
        password: { type: string, minLength: 1, maxLength: 4096, writeOnly: true }
    IntegrationSelectionInput:
      type: object
      required: [category, provider]
      properties:
        category: { type: string, enum: [hris, ats, meeting] }
